* { margin:0; padding:0; box-sizing:border-box; }

body {

}

/* 细腻网点装饰 */
.bg-dots {
  position:absolute; inset:0;
  background-image: radial-gradient(circle, rgba(100,120,200,0.12) 1px, transparent 1px);
  background-size: 28px 28px;
}

/* ===== 玻璃态基类 ===== */
.glass {
  background: rgba(255,255,255,0.52);

  border: 1px solid rgba(255,255,255,0.75);
  box-shadow: 0 4px 24px rgba(100,120,200,0.10), inset 0 1px 0 rgba(255,255,255,0.9);
}

/* ===== 顶栏 ===== */
.header {
  position:absolute; top:10px; left:10px; right:10px;

.title-sub { font-size:11px; color:rgba(80,90,140,0.6); margin-top:1px; letter-spacing:0.06em; }
.header-right { display:flex; gap:20px; align-items:center; }
.hstat { display:flex; flex-direction:column; align-items:flex-end; }
.hstat-v { font-size:17px; font-weight:700; color:#7c6bff; line-height:1; }
.hstat-l { font-size:9px; color:rgba(80,90,150,0.5); margin-top:2px; letter-spacing:0.06em; }
.hdiv { width:1px; height:24px; background:rgba(120,130,200,0.2); }

  position:absolute;
  top:76px; left:10px; right:10px; bottom:10px;
  display:flex; gap:8px;
}

.left-legend {
  width:100px; flex-shrink:0;
  border-radius:14px;
  display:flex; flex-direction:column;
  padding:16px 12px;
  gap:0;
  z-index:20;
}
.leg-title {
  font-size:8.5px; font-weight:600; letter-spacing:0.12em;
  color:rgba(80,90,150,0.45); text-transform:uppercase;
  margin-bottom:10px;
  display:flex; align-items:center; gap:5px;

  background:linear-gradient(180deg,#7c6bff,#ff6bb5);
}
.leg-item {
  display:flex; align-items:center; gap:7px;
  font-size:11px; color:rgba(60,70,130,0.75);

.leg-line { width:20px; height:2.5px; border-radius:2px; flex-shrink:0; }

.leg-line.n { background:linear-gradient(90deg,#94a3b8,#b0bcd4); }
.leg-line.t { background:linear-gradient(90deg,#f87171,#fca5a5); }

.leg-sep { height:1px; background:rgba(120,130,200,0.15); margin:8px 0; }

.leg-node-item {
  display:flex; align-items:flex-start; gap:7px;
  font-size:10px; color:rgba(60,70,130,0.65);
  line-height:1.4; margin-bottom:9px;

.leg-cluster-item {
  display:flex; align-items:center; gap:7px;

.leg-cluster-dot {

.rank-no { width:14px; font-size:10px; font-weight:700; text-align:center; flex-shrink:0; }
.rank-no.g1 { color:#f59e0b; } .rank-no.g2 { color:#9ca3af; } .rank-no.g3 { color:#b45309; } .rank-no.gn { color:rgba(80,90,150,0.4); }
.rank-avatar { width:28px; height:28px; border-radius:50%; flex-shrink:0; overflow:hidden; box-shadow:0 2px 8px rgba(100,120,200,0.18); }
.rank-info { flex:1; min-width:0; }
.rank-name { font-size:11px; font-weight:500; color:rgba(40,50,110,0.88); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rank-bar-wrap { display:flex; align-items:center; gap:5px; margin-top:2px; }
.rank-bar-bg { flex:1; height:2.5px; background:rgba(120,130,200,0.14); border-radius:2px; overflow:hidden; }

.rank-count { font-size:9px; color:rgba(80,90,150,0.4); flex-shrink:0; }

/* 小团体 */
.cluster-list { display:flex; flex-direction:column; gap:7px; }
.cluster-item { display:flex; align-items:flex-start; gap:8px; }
.cluster-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-top:3px; }

  font-size:9px; color:rgba(80,90,150,0.3);
  letter-spacing:0.05em; z-index:30;

</style>

const graphEl  = document.querySelector('.graph-area');
const SVG_W = graphEl.offsetWidth  || 1400;
const SVG_H = graphEl.offsetHeight || 994;

const radiusScale = d3.scaleSqrt()
  .domain([d3.min(members,d=>d.msgCount), maxMsg])
  .range([18,50]);

const svg  = d3.select("#graph-svg").attr("width",SVG_W).attr("height",SVG_H);
const defs = svg.append("defs");

// 发光滤镜
const gf = defs.append("filter").attr("id","glow").attr("x","-60%").attr("y","-60%").attr("width","220%").attr("height","220%");
gf.append("feGaussianBlur").attr("stdDeviation","3.5").attr("result","blur");
const gm2 = gf.append("feMerge");
gm2.append("feMergeNode").attr("in","blur");
gm2.append("feMergeNode").attr("in","SourceGraphic");

// 团体光晕
const hf = defs.append("filter").attr("id","halo").attr("x","-50%").attr("y","-50%").attr("width","200%").attr("height","200%");
hf.append("feGaussianBlur").attr("stdDeviation","20").attr("result","blur");
const hm2 = hf.append("feMerge");
hm2.append("feMergeNode").attr("in","blur");
hm2.append("feMergeNode").attr("in","SourceGraphic");

// 阴影滤镜（节点卡片感）
const sf = defs.append("filter").attr("id","shadow").attr("x","-30%").attr("y","-30%").attr("width","160%").attr("height","160%");
sf.append("feDropShadow").attr("dx","0").attr("dy","3").attr("stdDeviation","6").attr("flood-color","rgba(100,120,200,0.18)");

// 节点 pattern + clipPath
members.forEach(m=>{
  const r = radiusScale(m.msgCount);
  const col = commColor[m.community];
  defs.append("clipPath").attr("id",`clip-${m.id}`)
    .append("circle").attr("cx",0).attr("cy",0).attr("r",r-1.5);

  const svgStr = encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="${r*2}" height="${r*2}">
      <defs>
        <radialGradient id="ng" cx="38%" cy="30%">
          <stop offset="0%" stop-color="${lighten(col,0.45)}"/>
          <stop offset="100%" stop-color="${col}"/>
        </radialGradient>
      </defs>
      <circle cx="${r}" cy="${r}" r="${r}" fill="url(#ng)"/>
      <text x="${r}" y="${r+1}" dominant-baseline="middle" text-anchor="middle"
        font-family="PingFang SC,Microsoft YaHei,sans-serif"
        font-size="${r*0.68}px" font-weight="700"
        fill="rgba(255,255,255,0.95)">${m.name[0]}</text>
    </svg>`);

  const pat = defs.append("pattern")
    .attr("id",`av-${m.id}`)
    .attr("patternUnits","objectBoundingBox")
    .attr("width",1).attr("height",1);
  pat.append("image")
    .attr("href",`data:image/svg+xml;utf8,${svgStr}`)
    .attr("x",-(r-1.5)).attr("y",-(r-1.5))
    .attr("width",(r-1.5)*2).attr("height",(r-1.5)*2);
});

// Force simulation
const nodeData = members.map(m=>({...m, radius:radiusScale(m.msgCount)}));
const linkData  = links.map(l=>({...l}));

const commCenters = communities.map((c,i)=>{
  const angles = [225, 315, 135, 45];
  const deg = angles[i] * Math.PI / 180;
  const dist = Math.min(SVG_W,SVG_H) * 0.28;
  return { x: SVG_W/2 + Math.cos(deg)*dist, y: SVG_H/2 + Math.sin(deg)*dist };
});

const simulation = d3.forceSimulation(nodeData)
  .force("link", d3.forceLink(linkData).id(d=>d.id).distance(d=>180-d.weight*85).strength(0.5))
  .force("charge", d3.forceManyBody().strength(-340))
  .force("center", d3.forceCenter(SVG_W/2, SVG_H/2).strength(0.04))
  .force("collision", d3.forceCollide().radius(d=>d.radius+26).strength(0.9))
  .force("community", ()=>{
    nodeData.forEach(d=>{
      const c = commCenters[d.community];
      d.vx += (c.x-d.x)*0.02;
      d.vy += (c.y-d.y)*0.02;
    });
  });

for(let i=0;i<600;i++) simulation.tick();
simulation.stop();

// ---- 团体背景 ----
const haloG = svg.append("g");
communities.forEach((c,ci)=>{
  const ns = nodeData.filter(n=>n.community===ci);
  if(ns.length<2) return;
  const xs=ns.map(n=>n.x), ys=ns.map(n=>n.y);
  const ex=(d3.max(xs)+d3.min(xs))/2, ey=(d3.max(ys)+d3.min(ys))/2;
  const rx=(d3.max(xs)-d3.min(xs))/2+58, ry=(d3.max(ys)-d3.min(ys))/2+50;

  // 柔光填充
  haloG.append("ellipse")
    .attr("cx",ex).attr("cy",ey).attr("rx",rx*1.1).attr("ry",ry*1.1)
    .attr("fill",c.color).attr("opacity",0.07).attr("filter","url(#halo)");

  // 虚线描边
  haloG.append("ellipse")
    .attr("cx",ex).attr("cy",ey).attr("rx",rx).attr("ry",ry)
    .attr("fill",c.color).attr("fill-opacity",0.04)
    .attr("stroke",c.color).attr("stroke-width",1.5)
    .attr("stroke-opacity",0.35).attr("stroke-dasharray","6 4");

  // 团体名标签
  haloG.append("text")
    .attr("x",ex).attr("y",ey-ry-8)
    .attr("text-anchor","middle")
    .attr("font-size","11.5px").attr("font-weight","700")
    .attr("letter-spacing","0.06em")
    .attr("fill",c.color).attr("opacity",0.7)
    .attr("font-family","'Noto Sans SC','PingFang SC',sans-serif")
    .text(c.name);
});

// ---- 边 ----
const lg = svg.append("g");

lg.selectAll("path.el")
  .data(linkData).enter().append("path").attr("class","el")
  .attr("fill","none")
  .attr("stroke",d=>sentimentColor[d.sentiment])
  .attr("stroke-width",d=>1+d.weight*3.8)
  .attr("stroke-opacity",d=>0.25+d.weight*0.45)
  .attr("d",d=>{
    const dx=d.target.x-d.source.x, dy=d.target.y-d.source.y;
    const dr=Math.sqrt(dx*dx+dy*dy)*1.3;
    return `M${d.source.x},${d.source.y} A${dr},${dr} 0 0,1 ${d.target.x},${d.target.y}`;
  });

// 边标签背景
lg.selectAll("rect.elb")
  .data(linkData).enter().append("rect").attr("class","elb")
  .attr("rx",4).attr("ry",4)
  .attr("fill","rgba(255,255,255,0.78)")
  .attr("stroke",d=>sentimentColor[d.sentiment])
  .attr("stroke-width",0.7).attr("stroke-opacity",0.5)
  .each(function(d){
    const w=d.label.length*8+14, h=16;
    const mx=(d.source.x+d.target.x)/2, my=(d.source.y+d.target.y)/2;
    d3.select(this).attr("width",w).attr("height",h).attr("x",mx-w/2).attr("y",my-h+2);
  });

// 边标签
lg.selectAll("text.elt")
  .data(linkData).enter().append("text").attr("class","elt")
  .attr("x",d=>(d.source.x+d.target.x)/2)
  .attr("y",d=>(d.source.y+d.target.y)/2-3)
  .attr("text-anchor","middle").attr("dominant-baseline","middle")
  .attr("font-size","10px").attr("fill",d=>{
    const c={friendly:"#059669",neutral:"#64748b",tense:"#dc2626"};
    return c[d.sentiment];
  })
  .attr("font-weight","500").attr("opacity",0.9)
  .attr("font-family","'Noto Sans SC','PingFang SC',sans-serif")
  .text(d=>d.label);

// 互动次数角标
lg.selectAll("text.ec")
  .data(linkData.filter(d=>d.weight>0.45)).enter()
  .append("text").attr("class","ec")
  .attr("x",d=>(d.source.x+d.target.x)/2)
  .attr("y",d=>(d.source.y+d.target.y)/2+10)
  .attr("text-anchor","middle")
  .attr("font-size","8.5px").attr("fill","rgba(80,90,140,0.38)")
  .attr("font-family","'Noto Sans SC','PingFang SC',sans-serif")
  .text(d=>`×${d.count}`);

// ---- 节点 ----
const ng2 = svg.append("g");
const nodeEl = ng2.selectAll("g.nd")
  .data(nodeData).enter().append("g").attr("class","nd")
  .attr("transform",d=>`translate(${d.x},${d.y})`);

// 白色卡片底（玻璃态感）
nodeEl.append("circle")
  .attr("r",d=>d.radius+5)
  .attr("fill","rgba(255,255,255,0.55)")
  .attr("filter","url(#shadow)");

// 外晕
nodeEl.filter(d=>d.msgCount>130)
  .append("circle")
  .attr("r",d=>d.radius+8).attr("fill","none")
  .attr("stroke",d=>commColor[d.community])
  .attr("stroke-width",1.5).attr("stroke-opacity",0.28)
  .attr("filter","url(#glow)");

// 彩色描边
nodeEl.append("circle")
  .attr("r",d=>d.radius+2.5).attr("fill","none")
  .attr("stroke",d=>commColor[d.community])
  .attr("stroke-width",2.5).attr("stroke-opacity",0.9)
  .attr("filter","url(#glow)");

// 头像
nodeEl.append("circle")
  .attr("r",d=>d.radius-1.5)
  .attr("fill",d=>`url(#av-${d.id})`)
  .attr("clip-path",d=>`url(#clip-${d.id})`);

// 高光
nodeEl.append("ellipse")
  .attr("cx",d=>-d.radius*0.12).attr("cy",d=>-d.radius*0.42)
  .attr("rx",d=>d.radius*0.44).attr("ry",d=>d.radius*0.2)
  .attr("fill","rgba(255,255,255,0.22)").attr("pointer-events","none");

// 昵称
nodeEl.append("text")
  .attr("y",d=>d.radius+15).attr("text-anchor","middle")
  .attr("font-size",d=>Math.max(10,Math.min(13,9+(d.msgCount/maxMsg)*4))+"px")
  .attr("font-weight","700").attr("fill","rgba(40,50,110,0.88)")
  .attr("font-family","'Noto Sans SC','PingFang SC',sans-serif")
  .text(d=>d.name.length>6?d.name.slice(0,6)+'…':d.name);

// 发言数
nodeEl.append("text")
  .attr("y",d=>d.radius+28).attr("text-anchor","middle")
  .attr("font-size","9px").attr("font-weight","300")
  .attr("fill",d=>commColor[d.community]).attr("opacity",0.75)
  .attr("font-family","'Noto Sans SC','PingFang SC',sans-serif")
  .text(d=>`${d.msgCount} 条`);

// 截图信号
const rdy = document.createElement("div");
rdy.id="graph-ready";
document.body.appendChild(rdy);
</script>
</body>
</html>
